name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # "Log in with GitHub" settings (public values); see docs/github-login-setup.md.
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.GH_APP_SLUG }}
          VITE_AUTH_HELPER_URL: ${{ vars.AUTH_HELPER_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
