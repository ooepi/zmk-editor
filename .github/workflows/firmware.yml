# Builds the generated Lily58 config (test/generated/lily58/) with the same
# container and west commands as ZMK's build-user-config workflow, to prove
# that generated configs compile. The ZMK version comes from the generated
# west.yml, so this follows the editor's output.
name: Firmware build check

on:
  push:
    paths:
      - 'test/generated/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'test/generated/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

env:
  CONFIG_DIR: test/generated/lily58

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: echo "build_matrix=$(yq -oj -I0 "$CONFIG_DIR/build.yaml")" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    name: Build ${{ matrix.shield }}
    steps:
      - uses: actions/checkout@v5

      - name: Copy the generated config into a fresh west workspace
        run: |
          mkdir -p /tmp/ws
          cp -R "$CONFIG_DIR/config" /tmp/ws/config

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /tmp/ws/modules/
            /tmp/ws/tools/
            /tmp/ws/zephyr/
            /tmp/ws/bootloader/
            /tmp/ws/zmk/
          key: firmware-check-${{ hashFiles('test/generated/**/west.yml') }}

      - name: West init, update and export
        working-directory: /tmp/ws
        run: |
          [ -d .west ] || west init -l /tmp/ws/config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: West build
        working-directory: /tmp/ws
        shell: sh -x {0}
        run: >
          west build -s zmk/app -d /tmp/build -b "${{ matrix.board }}"
          -- -DZMK_CONFIG=/tmp/ws/config ${{ matrix.shield && format('-DSHIELD="{0}"', matrix.shield) || '' }}

      - name: Check that firmware was produced
        run: test -f /tmp/build/zephyr/zmk.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: /tmp/build/zephyr/zmk.uf2
