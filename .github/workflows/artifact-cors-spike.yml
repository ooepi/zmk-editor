# Spike for Milestone 6: checks whether a browser page on another origin can
# download an Actions artifact (the editor's .uf2 download). See
# scripts/spikes/artifact-cors.mjs. Runs on demand.
name: Artifact CORS spike

on:
  push:
    paths:
      - 'scripts/spikes/artifact-cors.mjs'
      - '.github/workflows/artifact-cors-spike.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: echo "fake firmware" > fake.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: fake.uf2

  download-in-browser:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/spikes/artifact-cors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
